name: Test book code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: book/tools/setup_dev.sh
      - run: book/tools/verify_code.sh
      - run: python3 book/tools/build_book.py --check
