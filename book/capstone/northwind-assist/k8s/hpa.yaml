# path: book/capstone/northwind-assist/k8s/hpa.yaml
# Scale the API on in-flight requests per pod, not CPU: the work is waiting on the model provider.
# The admission controller's capacity (NA_ADMISSION_CAPACITY) is the per-pod concurrency the SLO
# allows; the target below keeps pods at about 60% of it. Requires a custom-metrics adapter that
# exposes `northwind_inflight_requests` (exported from the admission snapshot); CPU is the fallback.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: northwind-assist-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: northwind-assist-api }
  # Pinned to one replica until approvals and idempotency move to a shared store (deployment.yaml);
  # then minReplicas: 3, maxReplicas: 20.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Pods
      pods:
        metric: { name: northwind_inflight_requests }
        target: { type: AverageValue, averageValue: "19" }
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
