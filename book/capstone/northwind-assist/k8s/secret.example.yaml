# path: book/capstone/northwind-assist/k8s/secret.example.yaml
# PLACEHOLDERS ONLY. Real values come from the secret manager (External Secrets, Vault, sealed
# secrets); never commit a filled-in copy. Rotation: update the store, then `kubectl rollout restart`.
apiVersion: v1
kind: Secret
metadata:
  name: northwind-assist-secrets
  labels: { app: northwind-assist }
type: Opaque
stringData:
  OPENAI_API_KEY: "<from-secret-store>"
  DATABASE_URL: "postgresql://<user>:<password>@<host>:5432/northwind"
  REDIS_URL: "rediss://<user>:<password>@<host>:6380/0"
  NA_MEMORY_SECRET: "<32+ random bytes>"
  CAPTURE_SALT: "<32+ random bytes>"
  RAG_AUTH_SECRET: "<unused by the capstone API; required by Project 3 settings>"
