# path: book/capstone/northwind-assist/otel-collector.yaml
# Development collector: OTLP in from api and worker, spans printed by the debug exporter.
# In production the exporter points at your tracing backend (Chapter 31). Content attributes are
# deleted here as a second line of defense behind the in-process redaction (Chapter 27, 31).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch: {}
  attributes/redact:
    actions:
      - pattern: ^.*\.content$
        action: delete
  tail_sampling:
    decision_wait: 10s
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow, type: latency, latency: { threshold_ms: 8000 } }
      - { name: baseline, type: probabilistic, probabilistic: { sampling_percentage: 10 } }
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, tail_sampling, batch]
      exporters: [debug]
