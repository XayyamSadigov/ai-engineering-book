[project]
name = "northwind-assist"
version = "1.0.0"
description = "Capstone of the AI Engineering book (Chapter 39): Northwind Assist as one production-grade system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aie-core",
  "ragkit",
  "p2-semantic-search",
  "evalkit",
  "toolkit",
  "agentkit",
  "memorykit",
  "guardrails",
  "reliability",
  "p1-extraction-api",
  "p4-support-assistant",
  "p3-rag-assistant",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.25",
  "pyjwt[crypto]>=2.8",
  "jinja2>=3.1",
  "numpy>=1.26",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.2", "ruff>=0.4", "mypy>=1.8", "fakeredis>=2.20", "pyyaml>=6.0"]  # pyyaml: Chapter 31 alert rules in tests
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.24"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
redis = ["redis>=5.0"]

[project.scripts]
northwind-assist-eval = "northwind_assist.evaluation.run_eval:main"
northwind-assist-worker = "northwind_assist.worker:main"

[tool.uv.sources]
aie-core = { path = "../../projects/aie_core", editable = true }
ragkit = { path = "../../projects/ragkit", editable = true }
p2-semantic-search = { path = "../../projects/p2-semantic-search", editable = true }
evalkit = { path = "../../projects/evalkit", editable = true }
toolkit = { path = "../../projects/toolkit", editable = true }
agentkit = { path = "../../projects/agentkit", editable = true }
memorykit = { path = "../../projects/memorykit", editable = true }
guardrails = { path = "../../projects/guardrails", editable = true }
reliability = { path = "../../projects/reliability", editable = true }
p1-extraction-api = { path = "../../projects/p1-extraction-api", editable = true }
p4-support-assistant = { path = "../../projects/p4-support-assistant", editable = true }
p3-rag-assistant = { path = "../../projects/p3-rag-assistant", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["northwind_assist"]

[tool.hatch.build.targets.wheel.force-include]
"northwind_assist/api/static" = "northwind_assist/api/static"
"northwind_assist/prompt_files" = "northwind_assist/prompt_files"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = ["integration: needs real infrastructure or a real provider; skipped by default"]
addopts = "-m 'not integration' -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]   # B008: FastAPI Depends/Query defaults are the idiom

[tool.ruff.lint.isort]
# Chapter example modules put on sys.path by northwind_assist._paths
known-third-party = ["caching", "budgets", "instrument", "otel_setup", "semconv", "metrics", "trace_store", "catalog", "router", "context", "prompts", "northwind_triage", "attack_corpus", "taskevals", "release_gate"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
