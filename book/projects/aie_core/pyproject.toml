[project]
name = "aie-core"
version = "0.1.0"
description = "Provider-neutral LLM client, gateway, embeddings, tracing, and settings for the AI Engineering book."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "httpx>=0.25",
  "numpy>=1.24",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-api>=1.20"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aie_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a real provider and API key; skipped by default"]
addopts = "-m 'not integration'"
