# path: book/projects/examples/ch08/pyproject.toml
[project]
name = "ch08-embeddings"
version = "0.1.0"
description = "Chapter 8: embedding math, versioned spaces, quality evaluation, and non-RAG use cases"
requires-python = ">=3.11"
dependencies = ["aie-core", "numpy>=1.26", "pydantic>=2.6", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
aie-core = { path = "../../aie_core", editable = true }

[tool.setuptools]
packages = ["embedlab", "embedlab.usecases"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real embedding provider; skipped by default"]
addopts = "-m 'not integration'"
