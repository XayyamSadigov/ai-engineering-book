# path: book/projects/examples/ch18/pyproject.toml
[project]
name = "ch18-mcp-examples"
version = "0.1.0"
description = "Chapter 18: a minimal MCP-style JSON-RPC server, client, and host adapter over stdio"
requires-python = ">=3.11"
dependencies = ["aie-core", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
aie-core = { path = "../../aie_core", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
