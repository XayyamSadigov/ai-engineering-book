# path: book/projects/examples/ch28/docker-compose.yml
# Development topology for an AI application (Chapter 28).
#
#   api            stateless FastAPI process; serves HTTP and SSE
#   worker         same image, different entry point; drains the job queue
#   postgres       relational state + pgvector (conversations, jobs, chunks, audit)
#   redis          queue, rate-limit buckets, retrieval/embedding caches
#   otel-collector receives traces/metrics from api and worker, prints them
#
# Secrets come from .env (see .env.example). Nothing here is production-grade:
# no TLS, no replicas, no persistent backups. Production is sketched in the chapter.

name: northwind-assist-dev

services:
  api:
    build: .
    command: ["python", "api_skeleton.py"]
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-fake-model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake-embedding}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql://assist:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/assist
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: assist-api
      REQUEST_BUDGET_S: "8"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "api_skeleton.py", "worker"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-fake-model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake-embedding}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql://assist:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/assist
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: assist-worker
      WORKER_CONCURRENCY: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 1   # scale with: docker compose up --scale worker=3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assist
    ports:
      - "127.0.0.1:5432:5432"   # local debugging only; never publish data stores on all interfaces
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assist -d assist"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction: Redis holds the job queue, and an eviction policy would silently drop queued jobs.
    # A cache that may evict belongs in a separate instance.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  pgdata:
