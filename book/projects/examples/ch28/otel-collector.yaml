# path: book/projects/examples/ch28/otel-collector.yaml
# Development collector: accept OTLP from api and worker, print spans to stdout.
# In production the exporter points at your tracing backend (Chapter 31).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
  attributes/redact:
    actions:
      # Chapter 31's capture policy writes content under "<key>.content" (llm.prompt.content,
      # llm.completion.content, tool.args.content, tool.result.content, retrieval.query.content).
      # Delete every such attribute here, independently of the in-process policy: if a route's
      # policy is misconfigured, content still never reaches the shared trace store.
      - pattern: ^.*\.content$
        action: delete
exporters:
  debug:
    verbosity: normal
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
