[project]
name = "aie-ch32-engineering-practices"
version = "0.3.0"
description = "Chapter 32: clean architecture, versioning, flags, record/replay, and CI/CD for an AI feature"
requires-python = ">=3.11"
dependencies = [
    "aie-core",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "pyyaml>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
triage-eval = "northwind_triage.eval_gate:main"

[tool.uv.sources]
aie-core = { path = "../../aie_core", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["northwind_triage*"]

[tool.setuptools.package-data]
northwind_triage = ["prompt_files/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a real LLM provider (skipped by default)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["northwind_triage"]
