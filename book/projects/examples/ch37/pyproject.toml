[project]
name = "ch37-advanced-retrieval"
version = "0.1.0"
description = "Chapter 37: agentic RAG, GraphRAG, TOC navigation, MaxSim, map-reduce and recursive reading, code search, long-context cost math"
requires-python = ">=3.11"
dependencies = ["aie-core", "agentkit", "ragkit", "pydantic>=2.6", "numpy>=1.24"]

[project.optional-dependencies]
graph = ["networkx>=3.0"]
dev = ["pytest>=8"]

[tool.uv.sources]
aie-core = { path = "../../aie_core", editable = true }
agentkit = { path = "../../agentkit", editable = true }
ragkit = { path = "../../ragkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real provider; skipped by default"]
addopts = "-m 'not integration'"
