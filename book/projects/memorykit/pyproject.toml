[project]
name = "memorykit"
version = "0.1.0"
description = "Memory stores for AI applications: conversation, semantic, episodic, and profile memory with write policy, consolidation, expiry, and deletion (Chapter 21)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aie-core",
  "pydantic>=2.5",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.uv.sources]
aie-core = { path = "../aie_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memorykit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real provider and API key; skipped by default"]
addopts = "-m 'not integration'"
