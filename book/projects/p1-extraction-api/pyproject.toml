[project]
name = "p1-extraction-api"
version = "0.1.0"
description = "Project 1 of the AI Engineering book: LLM-powered structured extraction API for Northwind invoices and support tickets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aie-core",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-timeout>=2.2"]

[project.scripts]
p1-eval = "extraction_api.eval.run_eval:main"

[tool.uv.sources]
aie-core = { path = "../aie_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extraction_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
markers = ["integration: needs a real provider and API key; skipped by default"]
addopts = "-m 'not integration'"
