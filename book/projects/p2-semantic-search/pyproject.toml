[project]
name = "p2-semantic-search"
version = "0.1.0"
description = "Project 2 of the AI Engineering book: a filtered semantic search system over Northwind documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aie-core",
  "numpy>=1.24",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
dev = ["pytest>=7.4", "httpx>=0.25"]

[project.scripts]
semsearch = "semsearch.cli:main"

[tool.uv.sources]
aie-core = { path = "../aie_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL with pgvector (DATABASE_URL); skipped by default"]
addopts = "-m 'not integration'"
