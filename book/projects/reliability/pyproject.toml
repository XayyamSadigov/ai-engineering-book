[project]
name = "reliability"
version = "0.1.0"
description = "System-level reliability primitives for AI services: deadlines, circuit breakers, bulkheads, admission control, job queues, workers, degradation, chaos testing (Chapter 29)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aie-core",
  "pydantic>=2.5",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "fakeredis[lua]>=2.20", "redis>=5.0"]

[tool.uv.sources]
aie-core = { path = "../aie_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a real Redis at REDIS_URL; skipped by default"]
addopts = "-m 'not integration'"
