[project]
name = "toolkit"
version = "0.1.0"
description = "Tool registry, policy engine, approvals, idempotent executor, sandbox runner, and tool-calling loop for the AI Engineering book (Chapter 16; imported by Chapters 19, 20, 22 and the capstone)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aie-core",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.2"]

[tool.uv.sources]
aie-core = { path = "../aie_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = ["integration: needs a real provider and API key; skipped by default"]
addopts = "-m 'not integration'"
