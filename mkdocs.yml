site_name: AI Engineering
site_description: A complete textbook and field guide for building production LLM applications.
site_url: https://xayyamsadigov.github.io/ai-engineering-book/
repo_url: https://github.com/XayyamSadigov/ai-engineering-book
repo_name: XayyamSadigov/ai-engineering-book
edit_uri: edit/main/book/
docs_dir: book
copyright: Text CC BY 4.0 · Code MIT

exclude_docs: |
  # only Markdown pages are published; code is browsed on GitHub
  /projects/**
  /capstone/**
  /analysis/**
  !/projects/**/*.md
  !/capstone/**/*.md
  !/analysis/*.md
  projects/shared-data/docs/
  AI_ENGINEERING_BOOK.md
  analysis/reviews/
  tools/
  **/.pytest_cache/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: info
    unrecognized_links: info

